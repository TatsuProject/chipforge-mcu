<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="sh" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="280" rx="10" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Development Roadmap</text>

  <!-- Timeline Arrow -->
  <line x1="40" y1="65" x2="960" y2="65" stroke="#cbd5e1" stroke-width="3"/>
  <polygon points="960,60 975,65 960,70" fill="#cbd5e1"/>

  <!-- ═══ PHASE 1: DONE ═══ -->
  <rect x="40" y="50" width="200" height="10" rx="3" fill="#16a34a"/>
  <circle cx="40" cy="65" r="8" fill="#16a34a"/>
  <text x="40" y="90" text-anchor="middle" font-size="8" fill="#16a34a" font-weight="600">START</text>

  <rect x="40" y="105" width="195" height="150" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="40" y="105" width="195" height="28" rx="8" fill="#16a34a"/>
  <rect x="40" y="121" width="195" height="12" fill="#16a34a"/>
  <text x="137" y="123" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Phase 1 — Core</text>

  <text x="55" y="152" font-size="9" fill="#166534">&#x2713;  RV32I base integer ISA</text>
  <text x="55" y="170" font-size="9" fill="#166534">&#x2713;  M-extension (mul/div)</text>
  <text x="55" y="188" font-size="9" fill="#166534">&#x2713;  C-extension (compressed)</text>
  <text x="55" y="206" font-size="9" fill="#166534">&#x2713;  Rigorous verification</text>
  <text x="55" y="224" font-size="9" fill="#166534">&#x2713;  Power optimization</text>

  <!-- Divider dot -->
  <circle cx="250" cy="65" r="8" fill="#16a34a" stroke="#fff" stroke-width="2"/>
  <text x="250" y="48" text-anchor="middle" font-size="8" fill="#16a34a" font-weight="600">NOW</text>

  <!-- ═══ PHASE 2: EXTENSIONS ═══ -->
  <rect x="250" y="50" width="200" height="10" rx="3" fill="#f59e0b" opacity="0.5"/>

  <rect x="250" y="105" width="195" height="150" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="250" y="105" width="195" height="28" rx="8" fill="#f59e0b"/>
  <rect x="250" y="121" width="195" height="12" fill="#f59e0b"/>
  <text x="347" y="123" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Phase 2 — Extensions</text>

  <text x="265" y="149" font-size="9" fill="#92400e">&#x25CB;  Scalar crypto (Zk*/Zbb)</text>
  <text x="265" y="164" font-size="9" fill="#92400e">&#x25CB;  F-extension (FPU)</text>
  <text x="265" y="179" font-size="9" fill="#92400e">&#x25CB;  Zicond</text>
  <text x="265" y="194" font-size="9" fill="#92400e">&#x25CB;  A-extension (atomics)</text>
  <text x="265" y="209" font-size="9" fill="#92400e">&#x25CB;  PQC accelerator</text>
  <text x="265" y="224" font-size="9" fill="#92400e">&#x25CB;  Extended verification</text>

  <!-- Divider dot -->
  <circle cx="460" cy="65" r="6" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- ═══ PHASE 3: SOC ═══ -->
  <rect x="460" y="50" width="200" height="10" rx="3" fill="#e5e7eb"/>

  <rect x="460" y="105" width="195" height="150" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="460" y="105" width="195" height="28" rx="8" fill="#64748b"/>
  <rect x="460" y="121" width="195" height="12" fill="#64748b"/>
  <text x="557" y="123" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Phase 3 — SoC</text>

  <text x="475" y="152" font-size="9" fill="#475569">&#x25CB;  Bus interconnect</text>
  <text x="475" y="170" font-size="9" fill="#475569">&#x25CB;  UART, SPI, I2C, GPIO</text>
  <text x="475" y="188" font-size="9" fill="#475569">&#x25CB;  Timer / WDT</text>
  <text x="475" y="206" font-size="9" fill="#475569">&#x25CB;  DMA controller</text>
  <text x="475" y="224" font-size="9" fill="#475569">&#x25CB;  FPGA prototyping</text>

  <!-- Divider dot -->
  <circle cx="670" cy="65" r="6" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- ═══ PHASE 4: SYSTEM SOFTWARE ═══ -->
  <rect x="670" y="50" width="290" height="10" rx="3" fill="#e5e7eb"/>

  <rect x="670" y="105" width="300" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="670" y="105" width="300" height="28" rx="8" fill="#a78bfa"/>
  <rect x="670" y="121" width="300" height="12" fill="#a78bfa"/>
  <text x="820" y="123" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Phase 4 — System Software</text>

  <text x="685" y="152" font-size="9" fill="#6d28d9">&#x25CB;  Debug Module (JTAG)</text>
  <text x="685" y="170" font-size="9" fill="#6d28d9">&#x25CB;  CLIC + PLIC</text>
  <text x="685" y="188" font-size="9" fill="#6d28d9">&#x25CB;  RTOS (FreeRTOS / Zephyr)</text>
  <text x="685" y="206" font-size="9" fill="#6d28d9">&#x25CB;  GDB / OpenOCD</text>
  <text x="685" y="224" font-size="9" fill="#6d28d9">&#x25CB;  SDK + toolchain</text>
</svg>
